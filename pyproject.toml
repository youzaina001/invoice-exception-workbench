[project]
name = "invoice-exception-workbench"
version = "0.1.0"
description = "LedgerLens: operator workbench for incomplete supplier invoices"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "PyJWT[crypto]>=2.10,<3",
    "jinja2",
    "uvicorn",
    "psycopg[binary]",
    "sqlalchemy",
    "pydantic-settings",
    "pgserver==0.1.4",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy", "playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
